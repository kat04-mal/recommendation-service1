databaseChangeLog:

  - changeSet:
      id: 001-create-rule-tables
      author: starbank

      changes:

        - createTable:
            tableName: recommendation_rule

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: product_text
                  type: TEXT
                  constraints:
                    nullable: false


        - createTable:
            tableName: rule_query

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false


              - column:
                  name: rule_id
                  type: BIGINT
                  constraints:
                    nullable: false


              - column:
                  name: query
                  type: VARCHAR(100)
                  constraints:
                    nullable: false


              - column:
                  name: arguments
                  type: TEXT
                  constraints:
                    nullable: false


              - column:
                  name: negate
                  type: BOOLEAN
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:

            baseTableName: rule_query
            baseColumnNames: rule_id

            referencedTableName: recommendation_rule
            referencedColumnNames: id

            constraintName: fk_rule_query_rule