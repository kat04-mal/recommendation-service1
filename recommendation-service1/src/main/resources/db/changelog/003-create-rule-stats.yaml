databaseChangeLog:

  - changeSet:
      id: 003-create-rule-stats
      author: starbank

      changes:

        - createTable:
            tableName: rule_stats

            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: rule_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:
            baseTableName: rule_stats
            baseColumnNames: rule_id

            referencedTableName: recommendation_rule
            referencedColumnNames: id

            constraintName: fk_rule_stats_rule